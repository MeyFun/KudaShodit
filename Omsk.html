
<div class="field">
  <label class="field-label" for="name">Ваше имя</label>
  <div class="input">
    <div class="icon">person</div>
    <input id="name" name="name" type="text" placeholder="Например, Алексей">
  </div>
</div>

<div class="field">
  <label class="field-label" for="phone">Телефон</label>
  <div class="input">
    <div class="icon">call</div>
    <input id="phone" name="phone" type="tel" placeholder="+7 (999) 000-00-00">
  </div>
</div>

<div class="field">
  <label class="field-label" for="email">Email</label>
  <div class="input">
    <div class="icon">mail</div>
    <input id="email" name="email" type="email" placeholder="omsk.afi.sha@example.ru">
  </div>
</div>
